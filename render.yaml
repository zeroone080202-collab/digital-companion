services:
  - type: web
    name: medi-research-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python tools/bootstrap.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEPLOYMENT_MODE
        value: public
      - key: MEDI_AI_PROVIDER
        value: gemini
      - key: MEDI_AI_RETRIES
        value: "2"
      - key: MEDI_AI_TIMEOUT
        value: "90"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OPERATOR_CONTACT
        sync: false
      - key: DATASET_RIGHTS_CONFIRMED
        value: "false"
      - key: ALLOW_OPEN_SIGNUP
        value: "true"
      - key: GUEST_DAILY_LIMIT
        value: "8"
